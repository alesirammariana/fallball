<!DOCTYPE html>
<html>
<head>
<style>
body {
height: 100vh;
margin: 0;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
font-family: Arial, sans-serif;
}
 
#container {
position: relative;
width: 100vw;
height: 100vh;
}
 
button {
padding: 12px 24px;
font-size: 18px;
cursor: pointer;
}
 
#yesBtn {
position: absolute;
left: 45%;
top: 50%;
}
 
#noBtn {
position: absolute;
left: 55%;
top: 50%;
}
</style>
</head>
<body>
 
<h1 style="position:absolute; top:30%; left:50%; transform:translateX(-50%);">
Proposal: Go to fall ball with me?
</h1>
 
<div id="container">
<button id="yesBtn">Yes</button>
<button id="noBtn">No</button>
</div>
 
<script>
alert("JavaScript is working!");
 
const noBtn = document.getElementById("noBtn");
 
noBtn.addEventListener("mouseover", function () {
noBtn.style.left = Math.random() * 800 + "px";
noBtn.style.top = Math.random() * 500 + "px";
});
</script>
 
</body>
</html>
