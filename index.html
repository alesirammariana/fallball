<!DOCTYPE html>
<html>
<head>
<style>
body {
height: 100vh;
margin: 0;
overflow: hidden;
font-family: Arial, sans-serif;
text-align: center;
}
 
h1 {
margin-top: 100px;
}
 
#yesBtn,
#noBtn {
padding: 12px 24px;
font-size: 18px;
cursor: pointer;
}
 
#yesBtn {
position: absolute;
left: 45%;
top: 50%;
}
 
#noBtn {
position: absolute;
left: 55%;
top: 50%;
}
</style>
</head>
<body>
 
<h1>Will you go to Fall Ball with me? 💕</h1>
 
<button id="yesBtn">Yes</button>
<button id="noBtn">No</button>
 
<script>
const noBtn = document.getElementById("noBtn");
 
function moveButton() {
const x = Math.random() * (window.innerWidth - 150);
const y = Math.random() * (window.innerHeight - 100);
 
noBtn.style.left = x + "px";
noBtn.style.top = y + "px";
}
 
noBtn.addEventListener("mouseover", moveButton);
</script>
 
</body>
</html>
